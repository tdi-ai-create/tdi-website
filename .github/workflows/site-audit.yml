name: TDI Site Audit

on:
  # Run after successful Vercel deployment
  deployment_status:
  # Run weekly on Mondays at 8am CST (14:00 UTC)
  schedule:
    - cron: '0 14 * * 1'
  # Manual trigger
  workflow_dispatch:

jobs:
  audit:
    # Only run on successful deployments, scheduled runs, or manual triggers
    if: github.event.deployment_status.state == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./audit
        run: |
          npm install
          # --with-deps runs apt-get update, which reads every source on the
          # runner image including Google's Chrome repo. On 9 September 2026
          # Google republished that index mid-run and apt refused it with a hash
          # sum mismatch, failing this job twice and blocking a merge for
          # reasons that had nothing to do with the code. We install Chromium
          # from Playwright's own download, so that repo is never needed here.
          # Removing the source does not uninstall the browser the image ships.
          # Ubuntu 24.04 runners also carry deb822 ".sources" files, so removing
          # only google-chrome.list left the repo defined and the job kept
          # failing. Match both formats.
          sudo rm -f /etc/apt/sources.list.d/*google*
          npx playwright install chromium --with-deps

      - name: Run Site Audit
        working-directory: ./audit
        run: npm run audit:ci
        continue-on-error: true
        id: audit

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdi-audit-report-${{ github.run_number }}
          path: ./audit/reports/
          retention-days: 30

      - name: Check audit result
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Site audit found critical errors. Check the uploaded report for details."
          exit 1
